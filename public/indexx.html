<script>
const CATS=['Food','Transportation','School Expenses','Bills','Rent','Leisure','Savings','Others'],DEF={Food:35,Transportation:10,'School Expenses':10,Bills:10,Rent:10,Leisure:10,Savings:10,Others:5},COL=['#2f7d4f','#e0a526','#4f8fbf','#b9622f','#8a6bbd','#d96f8a','#3aa59a','#8c8c7a'];
const M=[['b','Tapsilog',65],['b','Longsilog',55],['b','Egg sandwich',35],['b','Oatmeal & banana',25],['b','Pandesal & coffee',30],['b','Champorado',30],['b','Arroz caldo',40],['l','Chicken adobo & rice',75],['l','Pancit canton & rice',45],['l','Tortang talong & rice',50],['l','Sardines & egg rice',40],['l','Fried bangus & rice',85],['l','Sinigang na baboy & rice',95],['l','Ginisang monggo & rice',45],['d','Chicken tinola & rice',80],['d','Pork giniling & rice',60],['d','Egg & tomato rice',35],['d','Veggie chopsuey & rice',55],['d','Fried tilapia & rice',90],['d','Noodles with egg',30],['d','Tokwa at toyo & rice',35]];
const TN={b:'Breakfast',l:'Lunch',d:'Dinner'},SH={b:.25,l:.4,d:.35};
const PL=[['meal','Meal Planner',29,'Generate, save and edit daily and weekly meal plans'],['ins','Spending Insights',29,'Charts, reports, planned vs actual, food trends'],['fam','Family Budget',59,'Share budget progress with a parent, with your permission'],['prem','Premium',79,'Everything above, no ads (saves ₱37/month)']];
const $=n=>'₱'+Math.round(n).toLocaleString('en-PH'),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),v=id=>document.getElementById(id).value;
const day=o=>{const d=new Date();d.setDate(d.getDate()+(o||0));return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let D={users:{},cur:null},P={rep:7,flt:'All',q:'',edit:null,tab:'login',pd:0,pr:null};
let T='';try{T=localStorage.getItem('bt')||''}catch(e){}
async function api(p,m,b){const r=await fetch(p,{method:m||'GET',headers:{'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
let sv;const save=()=>{clearTimeout(sv);sv=setTimeout(()=>{if(D.cur)api('/api/state','PUT',U()).catch(e=>toast(e.message))},300)},U=()=>D.users[D.cur],has=(u,f)=>u.subs.includes(f)||u.subs.includes('prem');
function toast(m){const t=document.getElementById('t');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)}
async function H(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const ch of s)h=(h*33^ch.charCodeAt(0))>>>0;return 'f'+h.toString(16)}}
async function auth(reg){try{await auth2(reg)}catch(e){toast('Something went wrong: '+e.message)}}
async function auth2(reg){const email=v('em').trim().toLowerCase(),pw=v('pw');if(!email||pw.length<6)return toast('Enter an email and a password of at least 6 characters.');
const data=reg?{name:v('nm')||'Friend',type:v('ty'),done:0,ex:[],plan:{},bills:[],subs:[],share:0,allow:1500,period:'Weekly',pct:{...DEF},start:day()}:undefined;
const r=await api(reg?'/api/register':'/api/login','POST',{email,pw,data});T=r.token;try{localStorage.setItem('bt',T)}catch(e){}D={users:{[r.email]:r.data},cur:r.email};location.hash='';render()}
async function out(){try{await api('/api/logout','POST')}catch(e){}T='';try{localStorage.removeItem('bt')}catch(e){}D={users:{},cur:null};location.hash='';render()}
function calc(){const u=U(),L=u.period=='Weekly'?7:30,idx=Math.max(0,Math.round((new Date(day())-new Date(u.start))/864e5)),left=Math.max(1,L-idx),ex=u.ex.filter(e=>e.date>=u.start),sp={},al={};
CATS.forEach(c=>{sp[c]=0;al[c]=u.allow*u.pct[c]/100});ex.forEach(e=>sp[e.cat]+=e.amt);const tot=Object.values(sp).reduce((a,b)=>a+b,0),fl=al.Food-sp.Food;
return{u,L,left,ex,sp,al,tot,rem:u.allow-tot,fl,daily:Math.max(0,fl)/left,today:ex.filter(e=>e.date==day()).reduce((a,e)=>a+e.amt,0)}}
function alerts(c){const a=[],u=c.u;CATS.forEach(k=>{if(!c.al[k])return;const p=c.sp[k]/c.al[k];if(p>1)a.push({t:'bad',m:`${k} is over its budget by ${$(c.sp[k]-c.al[k])}.`,s:k=='Food'?`Pick meals under ${$(c.daily)} a day for the next ${c.left} days.`:`Move ${$(c.sp[k]-c.al[k])} from Leisure or Others, or pause ${k.toLowerCase()} spending.`});else if(p>=.8)a.push({t:'warn',m:`${k} is at ${Math.round(p*100)}% of its budget.`,s:`${$(c.al[k]-c.sp[k])} left.`})});
if(c.fl>0&&c.daily<80)a.push({t:'warn',m:`Food budget is low: about ${$(c.daily)} a day for ${c.left} more days.`,s:'Cheaper meal suggestions are on your Meal Planner.'});
u.bills.forEach(b=>{const n=Math.round((new Date(b.d)-new Date(day()))/864e5);if(n>=0&&n<=3)a.push({t:'warn',m:`${E(b.n)} (${$(b.a)}) is due ${n?'in '+n+' days':'today'}.`,s:''})});
a.push({t:'ok',m:`Today you spent ${$(c.today)}. You have ${$(c.rem)} of ${$(u.allow)} left for ${c.left} days.`,s:`That is about ${$(Math.max(0,c.rem)/c.left)} a day.`});return a}
const fit=(t,cap)=>{const l=M.map((m,i)=>[...m,i]).filter(m=>m[0]==t).sort((a,b)=>b[2]-a[2]);return(l.find(m=>m[2]<=cap)||l[l.length-1])[3]};
const rnd=(t,cap,not)=>{const l=M.map((m,i)=>[...m,i]).filter(m=>m[0]==t&&m[2]<=cap&&m[3]!=not);return l.length?l[Math.random()*l.length|0][3]:fit(t,cap)};
function gen(w){const c=calc(),u=c.u;if(!has(u,'meal'))return;for(let i=0;i<(w?7:1);i++){const k=day(i);u.plan[k]={};['b','l','d'].forEach(t=>u.plan[k][t]=rnd(t,c.daily*SH[t],u.plan[k]&&0))}save();toast(w?'Weekly plan saved.':'Today’s plan saved.');render()}
function setMeal(k,t,i){U().plan[k][t]=+i;save();render()}
function dayMeals(c,k){const p=c.u.plan[k];return p?['b','l','d'].map(t=>[t,p[t],1]):['b','l','d'].map(t=>[t,fit(t,c.daily*SH[t]),0])}
function allocForm(u){return `<div class="f2">${CATS.map((k,i)=>`<div><label for="p${i}">${k} (%)</label><input id="p${i}" type="number" min="0" max="100" value="${u.pct[k]}" oninput="sum()"></div>`).join('')}</div><div class="stk" id="stk"></div><p class="mut" id="sum"></p>`}
function sum(){document.getElementById('stk').innerHTML=CATS.map((k,i)=>`<i title="${k}" style="width:${+v('p'+i)||0}%;background:${COL[i]}"></i>`).join('');let s=0;CATS.forEach((c,i)=>s+=+v('p'+i)||0);const a=+v('al')||0;document.getElementById('sum').innerHTML=`Total: <b>${s}%</b> ${s==100?'✓':'(must be 100%)'}. Food budget: <b>${$(a*(+v('p0')||0)/100)}</b> per ${v('pd').toLowerCase().replace('ly','')}.`}
function readBudget(){const p={};let s=0;CATS.forEach((c,i)=>{p[c]=+v('p'+i)||0;s+=p[c]});if(s!=100){toast('Allocations add up to '+s+'%. Make them 100%.');return null}return p}
function seed(u){[['Pandesal & coffee',30,'Food',-3],['Jeepney fare',24,'Transportation',-3],['Lunch: adobo & rice',75,'Food',-3],['Printing',40,'School Expenses',-2],['Milk tea',90,'Leisure',-2],['Dinner: tinola',80,'Food',-2],['Load',50,'Bills',-1],['Tapsilog',65,'Food',-1],['Ride',48,'Transportation',-1],['Lunch: sinigang',95,'Food',0],['Notebook',55,'School Expenses',0]].forEach((x,i)=>u.ex.push({id:'s'+i,n:x[0],amt:x[1],cat:x[2],date:day(x[3]),desc:''}));u.bills.push({n:'Wi-Fi share',a:200,d:day(2)})}
function fin(){const u=U();if(u.type=='Student'){const p=readBudget();if(!p)return;u.allow=+v('al')||0;u.period=v('pd');u.pct=p;if(document.getElementById('sm').checked){u.start=u.period=='Weekly'?day(-3):day(-9);seed(u)}else u.start=day()}u.done=1;save();location.hash=u.type=='Parent'?'family':'dash';render()}
function saveBudget(){const p=readBudget();if(!p)return;const u=U();u.allow=+v('al')||0;u.period=v('pd');u.pct=p;save();toast('Budget saved.');render()}
function newPeriod(){if(confirm('Start a new budget period today? Past expenses stay in your history.')){U().start=day();save();render()}}
function addEx(){const n=v('en').trim(),a=+v('ea');if(!n||!(a>0))return toast('Add a name and an amount above ₱0.');const u=U(),o={n,amt:a,cat:v('ec'),date:v('ed')||day(),desc:v('ex')};if(P.edit){Object.assign(u.ex.find(e=>e.id==P.edit),o);P.edit=null;toast('Expense updated.')}else{u.ex.push({id:'e'+Date.now(),...o});toast('Expense added.')}save();render()}
function delEx(id){const u=U();u.ex=u.ex.filter(e=>e.id!=id);save();toast('Expense deleted.');render()}
function addBill(){const n=v('bn').trim(),a=+v('ba'),d=v('bd');if(!n||!d)return toast('Add a bill name and a due date.');U().bills.push({n,a,d});save();render()}
function delBill(i){U().bills.splice(i,1);save();render()}
function sub(id){const u=U();if(u.subs.includes(id))u.subs=u.subs.filter(x=>x!=id);else u.subs.push(id);save();toast(u.subs.includes(id)?'Subscribed (demo checkout, no payment taken).':'Subscription cancelled.');render()}
function prof(){U().name=v('pn')||U().name;save();toast('Profile saved.');render()}
function lockCard(t){return `<div class="card lock"><h2>🔒 ${t} is a paid feature</h2><p class="mut">Subscribe from Settings to unlock it.</p><a href="#settings"><button>View plans</button></a></div>`}
const bar=(p,x)=>`<div class="bar"><i class="${p>1?'x':p>=.8?'w':''}" style="width:${Math.min(100,p*100)}%"></i></div>`;
const txs=(l,ed)=>l.length?l.map(e=>`<div class="tx"><div><b>${E(e.n)}</b> <span class="tag">${e.cat}</span><div class="mut">${e.date}${e.desc?' · '+E(e.desc):''}</div></div><div>${$(e.amt)}${ed?`<div><button class="s" onclick="P.edit='${e.id}';render();scrollTo(0,0)">Edit</button><button class="d" onclick="delEx('${e.id}')">Delete</button></div>`:''}</div></div>`).join(''):'<p class="mut">No expenses yet. Add your first one from the Expenses page.</p>';
function mealRows(c,k,edit){return dayMeals(c,k).map(([t,i,s])=>`<div class="tx"><div><span class="mut">${TN[t]}</span><br>${edit&&s?`<select aria-label="${TN[t]}" onchange="setMeal('${k}','${t}',this.value)">${M.map((m,j)=>[...m,j]).filter(m=>m[0]==t).sort((a,b)=>a[2]-b[2]).map(m=>`<option value="${m[3]}" ${m[3]==i?'selected':''}>${m[1]} ${$(m[2])}${m[2]>c.daily*SH[t]?' (over budget)':''}</option>`).join('')}</select> <button class="s" onclick="showMeal(${i})">Recipe</button>`:`<b class="lk" onclick="showMeal(${i})">${M[i][1]} ›</b>`}</div><b>${$(M[i][2])}</b></div>`).join('')+`<div class="tx"><span>Estimated food cost</span><b>${$(dayMeals(c,k).reduce((a,m)=>a+M[m[1]][2],0))} <span class="mut">of ${$(c.daily)}/day</span></b></div>`}
function donut(c){const R=54,C=2*Math.PI*R,t=c.tot||1;let o=0;return `<svg viewBox="0 0 150 150" width="190" style="display:block;margin:auto" role="img" aria-label="Spending by category" onmouseleave="hl(-1)"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--line)" stroke-width="20"/>${CATS.map((k,i)=>{const d=c.sp[k]/t*C,s=`<circle class="seg" data-i="${i}" cx="75" cy="75" r="${R}" fill="none" stroke="${COL[i]}" stroke-width="20" stroke-dasharray="${Math.max(0,d-1.5)} ${C}" stroke-dashoffset="${-o}" transform="rotate(-90 75 75)" onmouseover="hl(${i})" onclick="hl(${i})"/>`;o+=d;return d?s:''}).join('')}<text id="dn" x="75" y="71" text-anchor="middle" font-size="11" fill="var(--mut)">Total spent</text><text id="dv" x="75" y="90" text-anchor="middle" font-size="16" font-weight="800" fill="var(--ink)">${$(c.tot)}</text></svg>`}
function hl(i){const c=calc();document.querySelectorAll('.seg').forEach(s=>{const a=+s.dataset.i==i;s.style.opacity=i<0||a?1:.3;s.setAttribute('stroke-width',a?25:20)});document.getElementById('dn').textContent=i<0?'Total spent':CATS[i];document.getElementById('dv').textContent=$(i<0?c.tot:c.sp[CATS[i]])}

const R=[['1 cup cooked rice|80 g tapa (beef strips, ready-marinated)|1 egg|1 tsp cooking oil|garlic','Fry the tapa in a little oil for 5-6 minutes until browned.|Fry the egg in the same pan.|Fry or reheat the rice with garlic.|Serve together.'],

['2 slices bread|1 egg|1 tsp oil or margarine|salt','Scramble or fry the egg with a pinch of salt.|Toast the bread.|Put the egg between the slices.'],
['1/2 cup rolled oats|1 cup water or milk|1 ripe banana|sugar (optional)','Boil the water, then add the oats.|Stir for 3-5 minutes until thick.|Top with sliced banana and a little sugar.'],
['3 pcs pandesal|1 sachet 3-in-1 coffee|hot water|margarine or peanut butter (optional)','Warm the pandesal in a pan.|Mix the coffee with hot water.|Spread margarine if you like.'],

expenses(){const c=calc(),u=c.u,e=P.edit&&u.ex.find(x=>x.id==P.edit)||{n:'',amt:'',cat:'Food',date:day(),desc:''};const l=u.ex.filter(x=>(P.flt=='All'||x.cat==P.flt)&&x.n.toLowerCase().includes(P.q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));

insights(){const u=U();if(!has(u,'ins'))return `<h1>Spending insights</h1>`+lockCard('Spending Insights');const c=calc(),ds=[...Array(P.rep>7?30:7).keys()].map(i=>day(i-(P.rep>7?29:6))),by=d=>u.ex.filter(e=>e.date==d),sm=a=>a.reduce((s,e)=>s+e.amt,0),dv=ds.map(d=>sm(by(d))),fv=ds.map(d=>sm(by(d).filter(e=>e.cat=='Food'))),mx=Math.max(1,...dv),tot=c.tot||1;let a=0;const cg=CATS.map((k,i)=>{const s=a;a+=c.sp[k]/tot*100;return `${COL[i]} ${s}% ${a}%`}).join(','),fm=Math.max(1,...fv),pts=fv.map((x,i)=>`${i*(280/(fv.length-1))},${70-x/fm*60}`).join(' ');

<div class="card"><h2>Where it goes</h2>${donut(c)}<p class="mut" style="text-align:center">Hover or tap a slice or a row</p>${CATS.map((k,i)=>`<div class="row lg" onmouseover="hl(${i})" onclick="hl(${i})"><span><span style="color:${COL[i]}">●</span> ${k}</span><span>${$(c.sp[k])} <span class="mut">${Math.round(c.sp[k]/tot*100)}%</span></span></div>`).join('')}</div></div><br>
<div class="grid"><div class="card"><h2>Planned vs actual</h2>${CATS.filter(k=>c.al[k]).map(k=>`<div class="row"><span>${k}</span><span class="mut">${$(c.sp[k])} of ${$(c.al[k])}</span></div>${bar(c.sp[k]/c.al[k])}`).join('')}</div>
<div class="card"><h2>Food spending trend</h2><svg viewBox="-10 0 300 90" width="100%" role="img" aria-label="Food spending trend"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--g)" stop-opacity=".35"/><stop offset="1" stop-color="var(--g)" stop-opacity="0"/></linearGradient></defs><polygon points="0,80 ${pts} 280,80" fill="url(#lg)"/><polyline points="${pts}" fill="none" stroke="var(--g)" stroke-width="3" stroke-linejoin="round"/>${fv.map((x,i)=>`<circle class="pt" r="5" cx="${i*(280/(fv.length-1))}" cy="${70-x/fm*60}" onmouseover="ftip('${ds[i]}',${x})" onclick="ftip('${ds[i]}',${x})"/>`).join('')}</svg><p class="mut" id="ft">Tap a point for that day’s food spending.</p><p class="mut">Food: ${$(c.sp.Food)} spent, ${$(Math.max(0,c.fl))} left.</p><h2>Remaining allowance</h2><div class="big">${$(c.rem)}</div></div></div>`},
